# Fork-only: a Windows build of upstream main, for before screenshots to try by hand. Not for upstream.
name: Windows build
on:
  push:
    branches: [windows-before]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --features demo
      - uses: actions/upload-artifact@v7
        with:
          name: zapfast-windows-x64-before
          path: target/release/zapfast.exe
